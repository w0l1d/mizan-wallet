name: 'Gradle Wrapper Upgrade'

on:
  workflow_dispatch:
  schedule:
    # Weekly, not daily: one developer does not need a wrapper-upgrade PR
    # every morning, and each run is a full Gradle bootstrap.
    - cron: '0 8 1 * *'  # 1st of the month at 08:00 UTC

jobs:
  upgrade-gradle-wrapper:
    runs-on: ubuntu-24.04
    env:
      WRAPPER_UPGRADE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global url."https://unused-username:${WRAPPER_UPGRADE_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Setup Java SDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Upgrade Gradle Wrapper
        run: ./gradlew upgradeGradleWrapperIvyWallet
