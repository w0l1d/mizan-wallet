name: APK

on:
  push:
    branches:
      # `develop` builds and validates a beta on every push, but does NOT send
      # it: publish_apk's `if` below deliberately omits develop. Dispatch this
      # workflow on develop when you actually want the APK in Telegram.
      - main
      - develop
    tags:
      # `v*` only. A beta tag IS the beta version string, so the old `'*'` made
      # every tag the publish job writes a candidate for re-triggering this
      # workflow - an endless build/send loop, prevented today only by GitHub
      # not firing workflows for pushes made with GITHUB_TOKEN. Don't rely on
      # that: a tag pushed by a human would loop.
      - 'v*'
  pull_request:
  workflow_dispatch:

# cancel-in-progress is scoped to pull_request on purpose: the auto_tag job below
# commits a version bump and pushes a tag on main, and cancelling that mid-push
# would leave the tag and libs.versions.toml out of sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auto_tag:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if commit is already tagged
        id: check_tag
        run: |
          # `v*` only: a beta tag written by the publish job names the same
          # commit but must never suppress the release bump.
          EXISTING_TAG=$(git tag --points-at HEAD --list 'v*')
          if [ -n "$EXISTING_TAG" ]; then
            echo "Commit already tagged: $EXISTING_TAG"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No tag found on this commit"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in libs.versions.toml
        if: steps.check_tag.outputs.skip == 'false'
        id: get_version
        run: |
          VERSION_FILE="gradle/libs.versions.toml"
          CURRENT_DATE=$(date +'%Y.%m.%d')
          VERSION_CODE=$(grep 'version-code =' $VERSION_FILE | awk -F'=' '{print $2}' | tr -d ' "')
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          sed -i "s/version-name = \".*\"/version-name = \"$CURRENT_DATE\"/" $VERSION_FILE
          sed -i "s/version-code = \".*\"/version-code = \"$NEW_VERSION_CODE\"/" $VERSION_FILE

          TAG_NAME="v${CURRENT_DATE}-${NEW_VERSION_CODE}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$CURRENT_DATE" >> $GITHUB_OUTPUT
          echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Commit version bump and push tag
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add gradle/libs.versions.toml
          git commit -m "chore: bump version to v${{ steps.get_version.outputs.version_name }} (${{ steps.get_version.outputs.version_code }}) [skip ci]"
          git push origin HEAD:main
          git tag ${{ steps.get_version.outputs.tag_name }}
          git push origin ${{ steps.get_version.outputs.tag_name }}

  assemble_demo_apk:
    needs: auto_tag
    if: |
      always() &&
      (needs.auto_tag.result == 'success' || needs.auto_tag.result == 'skipped')
    runs-on: ubuntu-latest
    # No `permissions:` block on purpose - this job runs on pull requests and
    # only ever reads. Everything that writes to the repo lives in publish_apk,
    # which pull requests never reach.
    outputs:
      version_name: ${{ needs.assemble_demo_apk.outputs.version_name }}
      version_code: ${{ needs.assemble_demo_apk.outputs.version_code }}
      channel: ${{ needs.assemble_demo_apk.outputs.channel }}
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_tag.outputs.tag_name != '' && needs.auto_tag.outputs.tag_name || github.ref }}
          # Full history + tags. The beta version counts commits since the last
          # release tag, which a depth-1 clone cannot do. This also replaces the
          # old explicit `git fetch --tags` step.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Main/tag pushes and manual dispatches write the Gradle user-home cache;
          # PR runs read it. See the same expression in test.yml et al.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Inject google-services.json
        run: |
          cat <<'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Build Demo APK
        run: ./gradlew assembleDemo

      - name: Validate APK version and resolve release channel
        id: validate
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi

          APK_PATH="app/build/outputs/apk/demo/app-demo.apk"
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          APK_VERSION_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          APK_VERSION_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")
          APK_LABEL=$(echo "$BADGING" | grep -oP "application-label:'\K[^']+")

          BASE_VERSION_CODE=$(grep 'version-code =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')

          # Expected version comes from the SAME script that will tag the commit
          # after a successful build, so the tag and the APK cannot disagree.
          # Release tags are `v*`; a beta tag from a previous publish of this
          # commit must not be mistaken for one.
          EXPECTED_VERSION_NAME=$(./scripts/tag-build.sh --print)

          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            CHANNEL="release"
            EXPECTED_VERSION_CODE="$BASE_VERSION_CODE"

            # A release tag can arrive by hand, not just from auto_tag, and
            # nothing else checks that its NAME agrees with the version the APK
            # actually carries. Without this, pushing `v9.9.9` onto any commit
            # ships that commit's toml version under a tag that lies about it.
            EXPECTED_TAG="v${EXPECTED_VERSION_NAME}-${BASE_VERSION_CODE}"
            if ! git tag --points-at HEAD --list 'v*' | grep -qx "$EXPECTED_TAG"; then
              echo "::error::release tag mismatch! This commit carries $(git tag --points-at HEAD --list 'v*' | tr '\n' ' ')but a build of it is version $EXPECTED_VERSION_NAME ($BASE_VERSION_CODE), which must be tagged $EXPECTED_TAG."
              exit 1
            fi
          else
            CHANNEL="beta"
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              COMMITS_SINCE=$(git rev-list --count "$LAST_TAG"..HEAD)
            else
              COMMITS_SINCE=$(git rev-list --count HEAD)
            fi
            # Betas number in their own space (see app/build.gradle.kts): `demo`
            # is a separate app from the `release` build Play sees, so this never
            # collides with the release lineage.
            EXPECTED_VERSION_CODE=$((BASE_VERSION_CODE * 100000 + COMMITS_SINCE))
          fi

          echo "Channel:  $CHANNEL"
          echo "APK:      $APK_VERSION_NAME ($APK_VERSION_CODE) labelled '$APK_LABEL'"
          echo "Expected: $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"

          if [ "$APK_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::APK version code mismatch! Built APK reports $APK_VERSION_CODE but expected $EXPECTED_VERSION_CODE"
            exit 1
          fi

          if [ "$APK_VERSION_NAME" != "$EXPECTED_VERSION_NAME" ]; then
            echo "::error::APK version name mismatch! Built APK reports $APK_VERSION_NAME but expected $EXPECTED_VERSION_NAME"
            exit 1
          fi

          # A beta must never ship labelled as the production app, and vice versa.
          EXPECTED_LABEL=$([ "$CHANNEL" = "beta" ] && echo "Mizan Beta" || echo "Mizan")
          if [ "$APK_LABEL" != "$EXPECTED_LABEL" ]; then
            echo "::error::APK is labelled '$APK_LABEL' but a $CHANNEL build must be labelled '$EXPECTED_LABEL'"
            exit 1
          fi

          echo "Validated: $APK_VERSION_NAME ($APK_VERSION_CODE), $CHANNEL, '$APK_LABEL'"

          # Downstream steps MUST use these - they come from the built artifact
          # itself, not from libs.versions.toml, which only knows the last release.
          echo "version_name=$APK_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Github Actions
        uses: actions/upload-artifact@v7
        with:
          name: Mizan-Demo.apk
          path: app/build/outputs/apk/demo/app-demo.apk


  publish_apk:
    needs: [auto_tag, assemble_demo_apk]
    # The publish gate. Only builds that actually get sent to people reach this
    # job, so only they are tagged - a PR run neither tags nor holds a token
    # that could. `always()` is needed because auto_tag is skipped off main.
    if: |
      always() &&
      needs.assemble_demo_apk.result == 'success' &&
      (needs.auto_tag.result == 'success' || needs.auto_tag.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_tag.outputs.tag_name != '' && needs.auto_tag.outputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Download the built APK
        uses: actions/download-artifact@v7
        with:
          name: Mizan-Demo.apk
          path: apk

      - name: Tag this commit with the version inside the APK
        env:
          VERSION_NAME: ${{ needs.assemble_demo_apk.outputs.version_name }}
          CHANNEL: ${{ needs.assemble_demo_apk.outputs.channel }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          if [ "$CHANNEL" = "release" ]; then
            # auto_tag already pushed `v<date>-<code>` for this commit.
            echo "Release build; already tagged by auto_tag. Nothing to do."
            exit 0
          fi

          # The version passed here was read out of the built APK, so the tag
          # created is byte-for-byte the string the user will see in Settings.
          ./scripts/tag-build.sh --push --remote origin --version "$VERSION_NAME"

      - name: Refuse to send an untagged build
        id: gate
        env:
          VERSION_NAME: ${{ needs.assemble_demo_apk.outputs.version_name }}
          CHANNEL: ${{ needs.assemble_demo_apk.outputs.channel }}
        run: |
          # The guarantee, enforced at the one place that matters: nothing leaves
          # here unless the exact commit it was built from is tagged on the
          # remote. A beta tag IS the version string; a release tag is `v*`.
          if [ "$CHANNEL" = "release" ]; then
            TAG_NAME=$(git tag --points-at HEAD --list 'v*' | head -1)
          else
            TAG_NAME="$VERSION_NAME"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "::error::no tag on this commit for a $CHANNEL build - refusing to send '$VERSION_NAME'."
            exit 1
          fi

          # `^{}` is the peeled line an annotated tag adds: the commit it names.
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG_NAME" \
                       | awk '$2 ~ /\^\{\}$/ {print $1}' | head -1)
          [ -z "$REMOTE_SHA" ] && \
            REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG_NAME" | awk '{print $1}' | head -1)

          if [ -z "$REMOTE_SHA" ]; then
            echo "::error::tag '$TAG_NAME' does not exist on origin - refusing to send this APK."
            exit 1
          fi
          if [ "$REMOTE_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::tag '$TAG_NAME' on origin points at $REMOTE_SHA, not the commit this APK was built from ($(git rev-parse HEAD))."
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "'$TAG_NAME' exists on origin and names this exact commit."

      - name: Gather release context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Version deliberately NOT read here: it comes from assemble_demo_apk,
          # which read it off the built APK. libs.versions.toml holds the last
          # RELEASED version and is wrong for every beta.
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "commit_subject=$COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "commit_author=$COMMIT_AUTHOR" >> "$GITHUB_OUTPUT"

          {
            echo "commit_body<<BODY_EOF"
            git log -1 --pretty=%b
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          # Associated-PRs endpoint: the PR(s) whose merge/squash produced this commit
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')
          echo "pr_number=$(echo "$PR_JSON" | jq -r '.[0].number // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(echo "$PR_JSON" | jq -r '.[0].title // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(echo "$PR_JSON" | jq -r '.[0].html_url // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_branch=$(echo "$PR_JSON" | jq -r '.[0].head.ref // empty')" >> "$GITHUB_OUTPUT"

      - name: Upload APK in Telegram Group
        # No `if:` - the whole job is already behind the publish gate.
        env:
          COMMIT_BODY: ${{ steps.context.outputs.commit_body }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c 1-7)
          COMMIT_LINK="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          APK_SHA256=$(sha256sum apk/app-demo.apk | awk '{print $1}')

          # Only a release tag has a GitHub release page behind it; a beta tag
          # is shown as the checkout target instead.
          TAG_INFO=""
          RELEASE_TAG=$(git tag --points-at HEAD --list 'v*' | head -1)
          if [ -n "$RELEASE_TAG" ]; then
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            TAG_INFO=$'\n📋 Release: '"$RELEASE_URL"
          fi

          COMMIT_SUBJECT="${{ steps.context.outputs.commit_subject }}"
          COMMIT_AUTHOR="${{ steps.context.outputs.commit_author }}"
          PR_NUMBER="${{ steps.context.outputs.pr_number }}"
          PR_TITLE="${{ steps.context.outputs.pr_title }}"
          PR_URL="${{ steps.context.outputs.pr_url }}"
          PR_BRANCH="${{ steps.context.outputs.pr_branch }}"

          # Truncate body to 400 chars to stay under Telegram's 1024-char caption limit
          BODY=$(printf '%s' "$COMMIT_BODY" | head -c 400)
          [ "${#COMMIT_BODY}" -gt 400 ] && BODY="${BODY}…"

          VERSION_LABEL="${{ needs.assemble_demo_apk.outputs.version_name }} (${{ needs.assemble_demo_apk.outputs.version_code }})"

          if [ "${{ needs.assemble_demo_apk.outputs.channel }}" = "beta" ]; then
            HEADER=$'🧪 Mizan BETA — not a release'
          else
            HEADER=$'🚀 Mizan RELEASE'
          fi

          CAPTION="$HEADER"$'\n📦 '"$VERSION_LABEL"
          CAPTION+=$'\n🏷 git checkout '"${{ steps.gate.outputs.tag_name }}"
          CAPTION+=$'\n\n📝 '"$COMMIT_SUBJECT"
          [ -n "$BODY" ] && CAPTION+=$'\n\n'"$BODY"
          if [ -n "$PR_NUMBER" ]; then
            CAPTION+=$'\n\n🔀 PR #'"$PR_NUMBER"$': '"$PR_TITLE"
            [ -n "$PR_BRANCH" ] && CAPTION+=$'\n🌿 Branch: '"$PR_BRANCH"
            [ -n "$PR_URL" ] && CAPTION+=$'\n🔗 '"$PR_URL"
          fi
          CAPTION+=$'\n\n🔖 Commit: '"$SHORT_SHA"$' by '"$COMMIT_AUTHOR"
          CAPTION+=$'\n🔗 '"$COMMIT_LINK"$TAG_INFO
          CAPTION+=$'\n🔐 SHA-256: '"$APK_SHA256"$'\n\n🚢 Please test before production.'

          curl -F "chat_id=-1003694191301" \
               -F "message_thread_id=14" \
               -F "document=@apk/app-demo.apk" \
               -F "caption=$CAPTION" \
               https://api.telegram.org/bot${{ secrets.BOTFATHER_TELEGRAM_BOT_TOKEN }}/sendDocument
