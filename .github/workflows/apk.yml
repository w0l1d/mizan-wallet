name: APK

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  auto_tag:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if commit is already tagged
        id: check_tag
        run: |
          EXISTING_TAG=$(git tag --points-at HEAD)
          if [ -n "$EXISTING_TAG" ]; then
            echo "Commit already tagged: $EXISTING_TAG"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No tag found on this commit"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in libs.versions.toml
        if: steps.check_tag.outputs.skip == 'false'
        id: get_version
        run: |
          VERSION_FILE="gradle/libs.versions.toml"
          CURRENT_DATE=$(date +'%Y.%m.%d')
          VERSION_CODE=$(grep 'version-code =' $VERSION_FILE | awk -F'=' '{print $2}' | tr -d ' "')
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          sed -i "s/version-name = \".*\"/version-name = \"$CURRENT_DATE\"/" $VERSION_FILE
          sed -i "s/version-code = \".*\"/version-code = \"$NEW_VERSION_CODE\"/" $VERSION_FILE

          TAG_NAME="v${CURRENT_DATE}-${NEW_VERSION_CODE}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$CURRENT_DATE" >> $GITHUB_OUTPUT
          echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Commit version bump and push tag
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add gradle/libs.versions.toml
          git commit -m "chore: bump version to v${{ steps.get_version.outputs.version_name }} (${{ steps.get_version.outputs.version_code }}) [skip ci]"
          git push origin HEAD:main
          git tag ${{ steps.get_version.outputs.tag_name }}
          git push origin ${{ steps.get_version.outputs.tag_name }}

  assemble_demo_apk:
    needs: auto_tag
    if: |
      always() &&
      (needs.auto_tag.result == 'success' || needs.auto_tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto_tag.outputs.tag_name != '' && needs.auto_tag.outputs.tag_name || github.ref }}

      - name: Fetch tags
        run: git fetch --tags

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Inject google-services.json
        run: |
          cat <<'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Build Demo APK
        run: ./gradlew assembleDemo

      - name: Validate APK version matches libs.versions.toml
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi

          APK_PATH="app/build/outputs/apk/demo/app-demo.apk"
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          APK_VERSION_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          APK_VERSION_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")

          EXPECTED_VERSION_NAME=$(grep 'version-name =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')
          EXPECTED_VERSION_CODE=$(grep 'version-code =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')

          echo "APK version: $APK_VERSION_NAME ($APK_VERSION_CODE)"
          echo "Expected version: $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"

          if [ "$APK_VERSION_NAME" != "$EXPECTED_VERSION_NAME" ] || [ "$APK_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::APK version mismatch! Built APK reports $APK_VERSION_NAME ($APK_VERSION_CODE) but libs.versions.toml has $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"
            exit 1
          fi

          echo "APK version validated: $APK_VERSION_NAME ($APK_VERSION_CODE)"

      - name: Upload APK to Github Actions
        uses: actions/upload-artifact@v4
        with:
          name: Mizan-Demo.apk
          path: app/build/outputs/apk/demo/app-demo.apk

      - name: Upload APK in Telegram Group
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c 1-7)
          COMMIT_LINK="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          COMMIT_MESSAGE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" | jq -r .commit.message | cut -c 1-100)
          APK_SHA256=$(sha256sum app/build/outputs/apk/demo/app-demo.apk | awk '{print $1}')

          TAG_INFO=""
          TAG_NAME=$(git tag --points-at HEAD | head -1)
          if [ -n "$TAG_NAME" ]; then
            TAG_INFO=$'\n\n🏷️ Tag: '"$TAG_NAME"
          fi

          CAPTION=$'📦 Mizan Wallet Demo APK\n\n'"$COMMIT_MESSAGE"$'\n\n🔖 Commit: '"$SHORT_SHA"$'\n🔗 '"$COMMIT_LINK"$TAG_INFO$'\n🔐 SHA-256: '"$APK_SHA256"

          curl -F "chat_id=-1003694191301" \
               -F "message_thread_id=14" \
               -F "document=@app/build/outputs/apk/demo/app-demo.apk" \
               -F "caption=$CAPTION" \
               https://api.telegram.org/bot${{ secrets.BOTFATHER_TELEGRAM_BOT_TOKEN }}/sendDocument
