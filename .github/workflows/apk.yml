name: APK

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# cancel-in-progress is scoped to pull_request on purpose: the auto_tag job below
# commits a version bump and pushes a tag on main, and cancelling that mid-push
# would leave the tag and libs.versions.toml out of sync.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  auto_tag:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if commit is already tagged
        id: check_tag
        run: |
          EXISTING_TAG=$(git tag --points-at HEAD)
          if [ -n "$EXISTING_TAG" ]; then
            echo "Commit already tagged: $EXISTING_TAG"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No tag found on this commit"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version in libs.versions.toml
        if: steps.check_tag.outputs.skip == 'false'
        id: get_version
        run: |
          VERSION_FILE="gradle/libs.versions.toml"
          CURRENT_DATE=$(date +'%Y.%m.%d')
          VERSION_CODE=$(grep 'version-code =' $VERSION_FILE | awk -F'=' '{print $2}' | tr -d ' "')
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          sed -i "s/version-name = \".*\"/version-name = \"$CURRENT_DATE\"/" $VERSION_FILE
          sed -i "s/version-code = \".*\"/version-code = \"$NEW_VERSION_CODE\"/" $VERSION_FILE

          TAG_NAME="v${CURRENT_DATE}-${NEW_VERSION_CODE}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$CURRENT_DATE" >> $GITHUB_OUTPUT
          echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Commit version bump and push tag
        if: steps.check_tag.outputs.skip == 'false'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add gradle/libs.versions.toml
          git commit -m "chore: bump version to v${{ steps.get_version.outputs.version_name }} (${{ steps.get_version.outputs.version_code }}) [skip ci]"
          git push origin HEAD:main
          git tag ${{ steps.get_version.outputs.tag_name }}
          git push origin ${{ steps.get_version.outputs.tag_name }}

  assemble_demo_apk:
    needs: auto_tag
    if: |
      always() &&
      (needs.auto_tag.result == 'success' || needs.auto_tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.auto_tag.outputs.tag_name != '' && needs.auto_tag.outputs.tag_name || github.ref }}
          # Full history + tags. The beta version counts commits since the last
          # release tag, which a depth-1 clone cannot do. This also replaces the
          # old explicit `git fetch --tags` step.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Main/tag pushes and manual dispatches write the Gradle user-home cache;
          # PR runs read it. See the same expression in test.yml et al.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Inject google-services.json
        run: |
          cat <<'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Build Demo APK
        run: ./gradlew assembleDemo

      - name: Validate APK version and resolve release channel
        id: validate
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found under \$ANDROID_HOME/build-tools"
            exit 1
          fi

          APK_PATH="app/build/outputs/apk/demo/app-demo.apk"
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          APK_VERSION_NAME=$(echo "$BADGING" | grep -oP "versionName='\K[^']+")
          APK_VERSION_CODE=$(echo "$BADGING" | grep -oP "versionCode='\K[^']+")
          APK_LABEL=$(echo "$BADGING" | grep -oP "application-label:'\K[^']+")

          BASE_VERSION_NAME=$(grep 'version-name =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')
          BASE_VERSION_CODE=$(grep 'version-code =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')

          # Mirror the channel logic in app/build.gradle.kts. A tagged commit is
          # a release and ships the version in libs.versions.toml verbatim; an
          # untagged commit is a beta and advertises the NEXT release instead:
          #   <build date>-beta.<commits since last tag>+<short sha>  (code + 1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_AT_HEAD=$(git tag --points-at HEAD)

          if [ -n "$TAG_AT_HEAD" ]; then
            CHANNEL="release"
            EXPECTED_VERSION_NAME="$BASE_VERSION_NAME"
            EXPECTED_VERSION_CODE="$BASE_VERSION_CODE"
          else
            CHANNEL="beta"
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              COMMITS_SINCE=$(git rev-list --count "$LAST_TAG"..HEAD)
            else
              COMMITS_SINCE=$(git rev-list --count HEAD)
            fi
            EXPECTED_VERSION_CODE=$((BASE_VERSION_CODE + 1))
            EXPECTED_VERSION_NAME="$(date -u +'%Y.%m.%d')-beta.$COMMITS_SINCE+$SHORT_SHA"
            # The Gradle build stamped its own date. If this step crosses UTC
            # midnight after that, yesterday's stamp is still correct.
            EXPECTED_VERSION_NAME_ALT="$(date -u -d yesterday +'%Y.%m.%d')-beta.$COMMITS_SINCE+$SHORT_SHA"
          fi

          echo "Channel:  $CHANNEL"
          echo "APK:      $APK_VERSION_NAME ($APK_VERSION_CODE) labelled '$APK_LABEL'"
          echo "Expected: $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"

          if [ "$APK_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::APK version code mismatch! Built APK reports $APK_VERSION_CODE but expected $EXPECTED_VERSION_CODE"
            exit 1
          fi

          if [ "$APK_VERSION_NAME" != "$EXPECTED_VERSION_NAME" ] && \
             [ "$APK_VERSION_NAME" != "${EXPECTED_VERSION_NAME_ALT:-}" ]; then
            echo "::error::APK version name mismatch! Built APK reports $APK_VERSION_NAME but expected $EXPECTED_VERSION_NAME"
            exit 1
          fi

          # A beta must never ship labelled as the production app, and vice versa.
          EXPECTED_LABEL=$([ "$CHANNEL" = "beta" ] && echo "Mizan Beta" || echo "Mizan")
          if [ "$APK_LABEL" != "$EXPECTED_LABEL" ]; then
            echo "::error::APK is labelled '$APK_LABEL' but a $CHANNEL build must be labelled '$EXPECTED_LABEL'"
            exit 1
          fi

          echo "Validated: $APK_VERSION_NAME ($APK_VERSION_CODE), $CHANNEL, '$APK_LABEL'"

          # Downstream steps MUST use these - they come from the built artifact
          # itself, not from libs.versions.toml, which only knows the last release.
          echo "version_name=$APK_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$APK_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Github Actions
        uses: actions/upload-artifact@v7
        with:
          name: Mizan-Demo.apk
          path: app/build/outputs/apk/demo/app-demo.apk

      - name: Gather release context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Version deliberately NOT read here: it comes from the validate step,
          # which reads it off the built APK. libs.versions.toml holds the last
          # RELEASED version and is wrong for every beta.
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "commit_subject=$COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "commit_author=$COMMIT_AUTHOR" >> "$GITHUB_OUTPUT"

          {
            echo "commit_body<<BODY_EOF"
            git log -1 --pretty=%b
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          # Associated-PRs endpoint: the PR(s) whose merge/squash produced this commit
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')
          echo "pr_number=$(echo "$PR_JSON" | jq -r '.[0].number // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(echo "$PR_JSON" | jq -r '.[0].title // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(echo "$PR_JSON" | jq -r '.[0].html_url // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_branch=$(echo "$PR_JSON" | jq -r '.[0].head.ref // empty')" >> "$GITHUB_OUTPUT"

      - name: Upload APK in Telegram Group
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          COMMIT_BODY: ${{ steps.context.outputs.commit_body }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c 1-7)
          COMMIT_LINK="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          APK_SHA256=$(sha256sum app/build/outputs/apk/demo/app-demo.apk | awk '{print $1}')

          TAG_INFO=""
          TAG_NAME=$(git tag --points-at HEAD | head -1)
          if [ -n "$TAG_NAME" ]; then
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
            TAG_INFO=$'\n📋 Release: '"$RELEASE_URL"
          fi

          COMMIT_SUBJECT="${{ steps.context.outputs.commit_subject }}"
          COMMIT_AUTHOR="${{ steps.context.outputs.commit_author }}"
          PR_NUMBER="${{ steps.context.outputs.pr_number }}"
          PR_TITLE="${{ steps.context.outputs.pr_title }}"
          PR_URL="${{ steps.context.outputs.pr_url }}"
          PR_BRANCH="${{ steps.context.outputs.pr_branch }}"

          # Truncate body to 400 chars to stay under Telegram's 1024-char caption limit
          BODY=$(printf '%s' "$COMMIT_BODY" | head -c 400)
          [ "${#COMMIT_BODY}" -gt 400 ] && BODY="${BODY}…"

          VERSION_LABEL="${{ steps.validate.outputs.version_name }} (${{ steps.validate.outputs.version_code }})"

          if [ "${{ steps.validate.outputs.channel }}" = "beta" ]; then
            HEADER=$'🧪 Mizan BETA — not a release'
          else
            HEADER=$'🚀 Mizan RELEASE'
          fi

          CAPTION="$HEADER"$'\n📦 '"$VERSION_LABEL"$'\n\n📝 '"$COMMIT_SUBJECT"
          [ -n "$BODY" ] && CAPTION+=$'\n\n'"$BODY"
          if [ -n "$PR_NUMBER" ]; then
            CAPTION+=$'\n\n🔀 PR #'"$PR_NUMBER"$': '"$PR_TITLE"
            [ -n "$PR_BRANCH" ] && CAPTION+=$'\n🌿 Branch: '"$PR_BRANCH"
            [ -n "$PR_URL" ] && CAPTION+=$'\n🔗 '"$PR_URL"
          fi
          CAPTION+=$'\n\n🔖 Commit: '"$SHORT_SHA"$' by '"$COMMIT_AUTHOR"
          CAPTION+=$'\n🔗 '"$COMMIT_LINK"$TAG_INFO
          CAPTION+=$'\n🔐 SHA-256: '"$APK_SHA256"$'\n\n🚢 Please test before production.'

          curl -F "chat_id=-1003694191301" \
               -F "message_thread_id=14" \
               -F "document=@app/build/outputs/apk/demo/app-demo.apk" \
               -F "caption=$CAPTION" \
               https://api.telegram.org/bot${{ secrets.BOTFATHER_TELEGRAM_BOT_TOKEN }}/sendDocument
