name: Internal Release

on:
  workflow_dispatch:

# No cancel-in-progress: these jobs upload to Google Play and create GitHub
# releases, so a second dispatch must queue behind the first, never kill it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  google_play_release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7
        with:
          # Full history + tags: app/build.gradle.kts decides release vs beta from
          # the tags at HEAD and counts commits since the last release tag. A
          # depth-1 clone has neither, and would version this build as a beta.
          fetch-depth: 0

      - name: Setup Java SDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: bundle install
      #----------------------------------------------------

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Dispatch-only workflow, so it always writes. setup-gradle defaults to
          # read-only whenever the ref is not the default branch, which would make
          # a release dispatched from develop silently skip seeding the cache.
          cache-read-only: false

      # Decode Secrets for production build
      - name: Create JKS for prod signing
        run: |
          echo "$SIGNING_KEYSTORE_JKS" > sign.jks.b64
          base64 -d -i sign.jks.b64 > sign.jks
        env:
          SIGNING_KEYSTORE_JKS: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Create Google Play Config file
        run: |
          echo "$PLAY_CONFIG_JSON" > play_config.json.b64
          base64 -d -i play_config.json.b64 > google-play-console-user.json
        env:
          PLAY_CONFIG_JSON: ${{ secrets.GOOGLE_PLAY_CONSOLE_JSON }}
      #--------------------------------------------------------------------------------

      - name: Inject google-services.json
        run: |
          cat <<'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Refuse to release an untagged commit
        run: |
          # Same guarantee as apk.yml: nothing ships unless its version is a tag.
          # A `release` build takes its version from libs.versions.toml verbatim,
          # so on an untagged commit it would ship to Play wearing the LAST
          # release's version - the exact bug this whole scheme exists to stop.
          RELEASE_TAG=$(git tag --points-at HEAD --list 'v*' | head -1)
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::HEAD carries no release tag (v*). Merge to main and let apk.yml's auto_tag cut one, or tag this commit, before releasing to Play."
            exit 1
          fi
          echo "Releasing $RELEASE_TAG"

      - name: Build production App Bundle
        run: bundle exec fastlane production_build
        env:
          # Uploads the R8 mapping so production crashes deobfuscate in Sentry.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload App Bundle to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Release App Bundle to Google PlayStore Internal Testing
        run: bundle exec fastlane internal_release
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

  github_release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for all branches and tags

      - name: Fetch tags
        run: git fetch --tags

      - name: Setup Java SDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '18'

      # Was a hand-rolled actions/cache over ~/.gradle/caches keyed on hashFiles of
      # every gradle file. Its restore-keys fallback happily restored a stale entry
      # and nothing ever pruned it, and its key scheme could not share anything with
      # the setup-gradle cache the other 8 workflows use. setup-gradle handles both.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Get version name and code from libs.versions.toml
        id: get_version
        run: |
          VERSION_NAME=$(grep 'version-name =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')
          VERSION_CODE=$(grep 'version-code =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Reuse or create release tag
        run: |
          EXPECTED_TAG="v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}"
          # `v*` only: a beta tag written by apk.yml's publish job names the same
          # commit but is not a release tag and must not be reused as one.
          EXISTING_TAG=$(git tag --points-at HEAD --list 'v*')

          if [ -n "$EXISTING_TAG" ]; then
            echo "Reusing existing tag from apk.yml auto_tag: $EXISTING_TAG"
            echo "TAG_NAME=$EXISTING_TAG" >> $GITHUB_ENV
          else
            echo "No tag on HEAD yet, creating $EXPECTED_TAG"
            git config --global user.email "actions@github.com"
            git config --global user.name "GitHub Actions"
            git tag $EXPECTED_TAG
            git push origin $EXPECTED_TAG
            echo "TAG_NAME=$EXPECTED_TAG" >> $GITHUB_ENV
          fi

      - name: Build Demo APK
        run: ./gradlew assembleDemo
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload APK to Github Actions
        uses: actions/upload-artifact@v7
        with:
          name: Mizan-Demo.apk
          path: app/build/outputs/apk/demo/app-demo.apk

      # Keeps the asset named after the tag, as the old upload-release-asset
      # step did via its `asset_name` input.
      - name: Name the release asset after the tag
        run: cp app/build/outputs/apk/demo/app-demo.apk "Mizan-${TAG_NAME}.apk"

      # Replaces three dead actions: actions/create-release and
      # actions/upload-release-asset were archived by GitHub in 2020, and
      # Bullrich/generate-release-changelog last shipped in 2023. One maintained
      # action creates the release, writes the notes from the commits since the
      # previous tag, and attaches the APK.
      - name: Create GitHub Release with the APK attached
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: Mizan-${{ env.TAG_NAME }}.apk

      - name: Gather release context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          echo "commit_subject=$COMMIT_SUBJECT" >> "$GITHUB_OUTPUT"
          echo "commit_author=$COMMIT_AUTHOR" >> "$GITHUB_OUTPUT"

          {
            echo "commit_body<<BODY_EOF"
            git log -1 --pretty=%b
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || echo '[]')
          echo "pr_number=$(echo "$PR_JSON" | jq -r '.[0].number // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_title=$(echo "$PR_JSON" | jq -r '.[0].title // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(echo "$PR_JSON" | jq -r '.[0].html_url // empty')" >> "$GITHUB_OUTPUT"
          echo "pr_branch=$(echo "$PR_JSON" | jq -r '.[0].head.ref // empty')" >> "$GITHUB_OUTPUT"

      - name: Announce in Telegram group
        env:
          COMMIT_BODY: ${{ steps.context.outputs.commit_body }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c 1-7)
          RELEASE_TAG=${{ env.TAG_NAME }}
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          COMMIT_LINK="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          APK_SHA256=$(sha256sum app/build/outputs/apk/demo/app-demo.apk | awk '{print $1}')

          COMMIT_SUBJECT="${{ steps.context.outputs.commit_subject }}"
          COMMIT_AUTHOR="${{ steps.context.outputs.commit_author }}"
          PR_NUMBER="${{ steps.context.outputs.pr_number }}"
          PR_TITLE="${{ steps.context.outputs.pr_title }}"
          PR_URL="${{ steps.context.outputs.pr_url }}"
          PR_BRANCH="${{ steps.context.outputs.pr_branch }}"

          BODY=$(printf '%s' "$COMMIT_BODY" | head -c 400)
          [ "${#COMMIT_BODY}" -gt 400 ] && BODY="${BODY}…"

          CAPTION=$'🚀 Mizan Wallet '"$RELEASE_TAG"$'\n\n📝 '"$COMMIT_SUBJECT"
          [ -n "$BODY" ] && CAPTION+=$'\n\n'"$BODY"
          if [ -n "$PR_NUMBER" ]; then
            CAPTION+=$'\n\n🔀 PR #'"$PR_NUMBER"$': '"$PR_TITLE"
            [ -n "$PR_BRANCH" ] && CAPTION+=$'\n🌿 Branch: '"$PR_BRANCH"
            [ -n "$PR_URL" ] && CAPTION+=$'\n🔗 '"$PR_URL"
          fi
          CAPTION+=$'\n\n🔖 Commit: '"$SHORT_SHA"$' by '"$COMMIT_AUTHOR"
          CAPTION+=$'\n🔗 '"$COMMIT_LINK"
          CAPTION+=$'\n📋 Release: '"$RELEASE_URL"
          CAPTION+=$'\n🔐 SHA-256: '"$APK_SHA256"$'\n\n🚢 Please test before production.'

          curl -F "chat_id=-1003694191301" \
               -F "message_thread_id=13" \
               -F "document=@app/build/outputs/apk/demo/app-demo.apk" \
               -F "caption=$CAPTION" \
               https://api.telegram.org/bot${{ secrets.BOTFATHER_TELEGRAM_BOT_TOKEN }}/sendDocument
