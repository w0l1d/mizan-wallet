name: Lint

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  # Manual trigger exists so the Gradle cache can be seeded on main without
  # waiting for a merge -- see cache-read-only below.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main pushes and manual dispatches write the Gradle user-home
          # cache; PR runs read it. Previously nothing ever wrote it (setup-gradle
          # is read-only off the default branch and main is pushed only on merge),
          # so every job started with an empty ~/.gradle: it re-downloaded the
          # Gradle distribution and recompiled all 45 modules from scratch.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Inject google-services.json
        run: |
          cat <<'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Lint (release)
        run: ./gradlew lintRelease

      - name: Upload Lint Release report to GitHub
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-release-report.html
          path: build/reports/lint/lint.html

      - name: Fail if lint errors are found
        run: |
          # Check if the lint XML report contains any error issues
          if grep -q 'severity="Error"' build/reports/lint/lint.xml; then
            echo "Lint errors found. Failing the build."
            exit 1
          fi