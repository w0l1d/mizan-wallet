name: Integration tests (androidTest)

on:
  push:
    branches:
      - main
  pull_request:
  # Manual trigger exists so the Gradle cache can be seeded on main without
  # waiting for a merge -- see cache-read-only below.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main pushes and manual dispatches write the Gradle user-home
          # cache; PR runs read it. Previously nothing ever wrote it (setup-gradle
          # is read-only off the default branch and main is pushed only on merge),
          # so every job started with an empty ~/.gradle: it re-downloaded the
          # Gradle distribution and recompiled all 45 modules from scratch.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enable KVM (emulator optimization)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.android/debug.keystore
          key: avd-34-keystore-v1

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 2
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Inject google-services.json
        run: |
          cat <<'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Build Mizan Wallet's code
        run: |
          ./gradlew :shared:data:core:assembleDebug :shared:data:core:assembleAndroidTest
          ./gradlew :shared:domain:assembleDebug :shared:domain:assembleAndroidTest

      - name: Run androidTest on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          cores: 2
          force-avd-creation: false
          emulator-boot-timeout: 600
          # The AVD cache restores a userdata image that still holds the app
          # packages installed by earlier runs. Those were signed with that run's
          # ~/.android/debug.keystore, so the keystore has to be cached too --
          # otherwise Gradle regenerates it, the signatures no longer match and the
          # reinstall fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
          #
          # -no-snapshot-save (NOT -no-snapshot): loads the boot snapshot written by
          # the create-AVD step and just doesn't write it back. -no-snapshot skips
          # the load as well, which forces a cold boot and blew past
          # emulator-boot-timeout on cache-hit runs.
          #
          # Keep these options in sync with the create-AVD step above: a snapshot is
          # only loadable by an emulator started with a matching hardware config.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Diagnostic only: shows which com.ivy.* leftovers the cached userdata
            # image carries, so a signature mismatch is obvious in the log.
            # Keep every command on ONE line -- the emulator-runner feeds this script
            # to sh line by line, so backslash continuations break with "| unexpected".
            adb wait-for-device; adb shell pm list packages | grep com.ivy || echo "no com.ivy.* packages present"
            ./gradlew :shared:data:core:connectedDebugAndroidTest
            ./gradlew :shared:domain:connectedDebugAndroidTest
