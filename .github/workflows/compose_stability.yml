name: Composables stability

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  # Manual trigger exists so the Gradle cache can be seeded on main without
  # waiting for a merge -- see cache-read-only below.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose_stability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main pushes and manual dispatches write the Gradle user-home
          # cache; PR runs read it. Previously nothing ever wrote it (setup-gradle
          # is read-only off the default branch and main is pushed only on merge),
          # so every job started with an empty ~/.gradle: it re-downloaded the
          # Gradle distribution and recompiled all 45 modules from scratch.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Inject google-services.json
        run: |
          cat <<'EOF' > app/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Build Compose compiler report (Jetpack Compose)
        run: ./gradlew assembleDemo -PcomposeCompilerReports=true

      - name: Analyze the report (Ivy)
        run: ./gradlew :ci-actions:compose-stability:run

      - name: Upload the Compose Stability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-stability-report
          path: ci-actions/compose-stability/ivy-compose-stability-report.txt