name: 'Close Stale Issues and PRs'

on:
  workflow_dispatch:
  # Disabled: days-before-pr-close: 1 was auto-closing active PRs (#4, #6, #8) before review.
  # Re-enable the schedule (and raise days-before-pr-close) once tuned.
  # schedule:
  #   - cron: '0 8 * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          days-before-pr-stale: 2
          days-before-pr-close: 1
          exempt-issue-labels: keep,P0,bug
          exempt-pr-labels: keep,P0
