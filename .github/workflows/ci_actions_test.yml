name: CI Actions tests

# These test the CI tooling itself, so they only need to run when that tooling
# changes - not on every app commit.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'ci-actions/**'
      - '.github/workflows/ci_actions_test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ci-actions/**'
      - '.github/workflows/ci_actions_test.yml'
  # Manual trigger exists so the Gradle cache can be seeded on main without
  # waiting for a merge -- see cache-read-only below.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_actions_test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v7

      - name: Setup Java SDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only main pushes and manual dispatches write the Gradle user-home
          # cache; PR runs read it. Previously nothing ever wrote it (setup-gradle
          # is read-only off the default branch and main is pushed only on merge),
          # so every job started with an empty ~/.gradle: it re-downloaded the
          # Gradle distribution and recompiled all 45 modules from scratch.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Only the two ci-actions modules still wired to a workflow are tested.
      # issue-assign, issue-create-comment and pr-description-check drove the
      # upstream project's contributor automation, whose workflows this fork
      # removed; their Gradle modules stay in the tree but are not exercised.
      - name: Test the CI actions "base"
        run: ./gradlew :ci-actions:base:test

      - name: Test the CI "compose_stability" action
        run: ./gradlew :ci-actions:compose-stability:test